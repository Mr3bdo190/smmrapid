<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMM Services & Pricing | RapidSMM</title><meta name="description" content="تصفح خدمات RapidSMM للتسويق عبر Instagram وTikTok وYouTube وTelegram وغيرها. الأسعار والحدود تُعرض من كتالوج الموقع الحالي."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://smmrapid.store/services/"><meta property="og:type" content="website"><meta property="og:site_name" content="RapidSMM"><meta property="og:title" content="SMM Services & Pricing | RapidSMM"><meta property="og:description" content="كتالوج خدمات SMM وأسعارها وحدودها الحالية."><link rel="stylesheet" href="/blog/blog.css"><style>.service{background:#0c131e;border:1px solid #1c2939;border-radius:16px;padding:18px}.price{font-size:22px;color:#f5c451;font-weight:800}.muted{color:#9badbf}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1;min-width:240px;background:#0c131e;border:1px solid #263548;border-radius:10px;padding:12px;color:#fff}.toolbar select{background:#0c131e;border:1px solid #263548;border-radius:10px;padding:12px;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.cat{margin-top:35px}.cat h2{color:#fff}</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/">RapidSMM</a><div class="links"><a href="/blog/">المدونة</a><a href="/how-it-works/">كيف تعمل</a><a href="/faq/">FAQ</a><a href="/contact/">الدعم</a><a href="/">الرئيسية</a></div></nav><header class="hero"><h1>خدمات SMM وأسعارها</h1><p>الكتالوج التالي يُحمّل من قاعدة بيانات RapidSMM الحالية. لا نعرض أرقام مستخدمين أو طلبات وهمية؛ الأسعار والحدود هي بيانات الخدمات المنشورة فعلياً.</p></header><div class="toolbar"><input id="q" placeholder="ابحث عن Instagram, TikTok, followers, likes..."><select id="cat"><option value="">كل الأقسام</option></select></div><div id="app"><p class="muted">جاري تحميل الكتالوج...</p></div><footer class="footer">RapidSMM · <a href="/blog/">SMM Blog</a> · <a href="/contact/">Support</a></footer></div><script>let data=[];const q=document.getElementById('q'),cat=document.getElementById('cat'),app=document.getElementById('app');function render(){const term=q.value.toLowerCase().trim(),c=cat.value;app.innerHTML='';data.filter(x=>!c||x.id===c).forEach(x=>{const wrap=document.createElement('section');wrap.className='cat';wrap.innerHTML='<h2>'+x.name+'</h2><div class="grid">'+x.services.filter(s=>!term||(s.name+' '+(s.description||'')).toLowerCase().includes(term)).map(s=>'<article class="service"><h3>'+esc(s.name)+'</h3><p class="muted">'+esc(s.description||'تفاصيل الخدمة متاحة عند الطلب.')+'</p><div class="price">'+Number(s.rate).toFixed(4)+' USD / 1K</div><p class="muted">الحد الأدنى: '+Number(s.min).toLocaleString()+' · الحد الأقصى: '+Number(s.max).toLocaleString()+'</p></article>').join('')+'</div>';app.appendChild(wrap)});if(!app.innerHTML)app.innerHTML='<p class="muted">لا توجد نتائج مطابقة.</p>'}function esc(v){return String(v).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}fetch('/api/public/services').then(r=>r.json()).then(x=>{data=x.categories||[];data.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;cat.appendChild(o)});render()}).catch(()=>app.innerHTML='<p class="muted">تعذر تحميل الكتالوج حالياً.</p>');q.oninput=render;cat.onchange=render;</script></body></html>
