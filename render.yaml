databases:
  - name: smm-panel-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: smm-panel
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smm-panel-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CURRENCY
        value: USD
      - key: HELEKET_CURRENCY
        value: USD
      - key: HELEKET_TO_WALLET_RATE
        value: "1"
